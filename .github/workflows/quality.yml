name: Quality gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run qa:seo
      - run: npm run qa:product-details
      - run: npm run qa:images
      - name: Authenticated WooCommerce drift audit
        if: github.event_name == 'schedule'
        run: npm run catalog:drift
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
