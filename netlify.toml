[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "product-route-guard"
  path = "/product/*"

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/orders/track"
  to = "/.netlify/functions/order-track"
  status = 200

[[redirects]]
  from = "/api/orders/status"
  to = "/.netlify/functions/order-status"
  status = 200

[[redirects]]
  from = "/api/client-error"
  to = "/.netlify/functions/client-error"
  status = 200

[[redirects]]
  from = "/api/account/delete-request"
  to = "/.netlify/functions/account-delete"
  status = 200

[[redirects]]
  from = "/api/cron/process-account-deletions"
  to = "/.netlify/functions/process-account-deletions"
  status = 200

[context.production]
  command = "npm run deploy:build"

[context.production.environment]
  APP_ENV = "production"
  SITE_URL = "https://purehealthpepetidesshop.com"
  VITE_SITE_URL = "https://purehealthpepetidesshop.com"
  VITE_GOOGLE_AUTH_ENABLED = "false"
  VITE_ACCOUNT_DELETION_ENDPOINT = "/api/account/delete-request"
  VITE_CHECKOUT_ENDPOINT = "/api/checkout"
  VITE_ORDER_TRACKING_ENDPOINT = "/api/orders/track"
  VITE_BUILD_SOURCEMAP = "false"

[context.deploy-preview.environment]
  APP_ENV = "staging"
  VITE_GOOGLE_AUTH_ENABLED = "false"
  VITE_ACCOUNT_DELETION_ENDPOINT = "/api/account/delete-request"
  VITE_CHECKOUT_ENDPOINT = "/api/checkout"
  VITE_ORDER_TRACKING_ENDPOINT = "/api/orders/track"
  VITE_BUILD_SOURCEMAP = "false"
